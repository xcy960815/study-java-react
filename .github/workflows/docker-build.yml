name: Docker Build and Push

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_NAME: xcy960815/study-java-react

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub repository overview from README
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ ! -f README.md ]; then
            echo "Error: README.md not found"
            exit 1
          fi

          DESCRIPTION=$(jq -Rs . < README.md)

          echo "Updating Docker Hub repository: ${{ env.IMAGE_NAME }}"
          echo "Username: ${DOCKERHUB_USERNAME}"
          echo "README length: $(wc -c < README.md) bytes"

          echo "Logging in to Docker Hub to get JWT token..."
          LOGIN_RESPONSE=$(curl -s -X POST \
            --url https://hub.docker.com/v2/users/login/ \
            --header "Content-Type: application/json" \
            --data "{\"username\": \"${DOCKERHUB_USERNAME}\", \"password\": \"${DOCKERHUB_TOKEN}\"}")

          JWT_TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.token // empty')

          if [ -z "$JWT_TOKEN" ] || [ "$JWT_TOKEN" = "null" ]; then
            echo "Warning: Failed to get JWT token, trying direct token authentication..."
            AUTH_HEADER="Authorization: JWT ${DOCKERHUB_TOKEN}"
          else
            echo "Successfully obtained JWT token"
            AUTH_HEADER="Authorization: JWT ${JWT_TOKEN}"
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            --request PATCH \
            --url https://hub.docker.com/v2/repositories/${{ env.IMAGE_NAME }}/ \
            --header "Content-Type: application/json" \
            --header "${AUTH_HEADER}" \
            --data "{\"full_description\": ${DESCRIPTION}}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
            echo "Successfully updated Docker Hub repository overview"
          else
            echo "Error: Failed to update Docker Hub repository overview"
            echo "HTTP Status: $HTTP_CODE"
            echo "Response: $BODY"
            echo "Warning: Docker Hub overview update failed, but continuing..."
          fi
